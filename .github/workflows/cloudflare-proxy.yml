name: Cloudflare HTTP Proxy

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install tinyproxy
        run: |
          sudo apt-get update
          sudo apt-get install -y tinyproxy wget curl

      - name: Configure tinyproxy
        run: |
          sudo sed -i 's/^Allow/#Allow/g' /etc/tinyproxy/tinyproxy.conf
          sudo sed -i 's/^#Port 8888/Port 8888/' /etc/tinyproxy/tinyproxy.conf

      - name: Start proxy
        run: |
          sudo service tinyproxy start
          sleep 2

      - name: Install cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared

      - name: Start Cloudflare tunnel
        run: |
          cloudflared tunnel --url http://localhost:8888 > tunnel.log 2>&1 &
          sleep 8

          echo "Public Proxy URL:"
          grep -Eo 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' tunnel.log

          tail -f tunnel.log
