name: Download Video Stream

on:
  workflow_dispatch:
    inputs:
      m3u8_url:
        description: "M3U8 playlist URL"
        required: true
        type: string
      release_name:
        description: "Release name"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download stream
        run: |
          mkdir output
          ffmpeg -loglevel error -y -i "${{ github.event.inputs.m3u8_url }}" -c copy -bsf:a aac_adtstoasc output/video.mp4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: ${{ github.event.inputs.release_name }}
          files: output/video.mp4
